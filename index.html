<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <form class="formulario" action="#" method="post" novalidate>

      <fieldset>
        <legend>Datos personales</legend>

        <div class="campo">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="nombre"
                 required minlength="2" placeholder="Tu nombre">
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos *</label>
          <input type="text" id="apellidos" name="apellidos"
                 required minlength="2">
        </div>

        <div class="campo">
          <label for="fecha">Fecha de nacimiento *</label>
          <input type="date" id="fecha" name="fecha" required
                 max="2010-12-31">
        </div>

        <div class="campo">
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" name="email"
                 required placeholder="usuario@dominio.com">
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono"
                 pattern="[0-9]{9}" title="9 dígitos">
        </div>
      </fieldset>

      <fieldset>
        <legend>Seguridad</legend>

        <div class="campo">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password"
                 required minlength="8">
          <small>Mínimo 8 caracteres.</small>
        </div>

        <div class="campo">
          <label for="password2">Confirmar contraseña *</label>
          <input type="password" id="password2" name="password2"
                 required minlength="8">
        </div>
      </fieldset>

      <fieldset>
        <legend>Perfil</legend>

        <div class="campo">
          <label for="usuario">Nombre de usuario *</label>
          <input type="text" id="usuario" name="usuario"
                 required pattern="[a-zA-Z0-9_]{3,15}"
                 title="3-15 caracteres alfanuméricos o guion bajo">
        </div>

        <div class="campo">
          <label for="pais">País *</label>
          <select id="pais" name="pais" required>
            <option value="">-- Selecciona --</option>
            <option value="es">España</option>
            <option value="mx">México</option>
            <option value="ar">Argentina</option>
            <option value="co">Colombia</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="campo">
          <label for="bio">Biografía</label>
          <textarea id="bio" name="bio" rows="4" maxlength="200"></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferencias</legend>

        <div class="campo-radio">
          <span>Género:</span>
          <label><input type="radio" name="genero" value="f" required> Femenino</label>
          <label><input type="radio" name="genero" value="m"> Masculino</label>
          <label><input type="radio" name="genero" value="o"> Otro</label>
        </div>

        <div class="campo-check">
          <label>
            <input type="checkbox" name="terminos" required>
            Acepto los términos y condiciones *
          </label>
        </div>

        <div class="campo-check">
          <label>
            <input type="checkbox" name="newsletter">
            Deseo recibir el boletín
          </label>
        </div>
      </fieldset>

      <div class="acciones">
        <button type="submit" class="btn-primario">Registrarse</button>
        <button type="reset" class="btn-secundario">Limpiar</button>
      </div>

    </form>
  </main>
</body>
</html>
